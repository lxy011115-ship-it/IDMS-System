<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDMS 用料与依据隔离验证</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/sales.css"><link rel="stylesheet" href="/manual.css"><link rel="stylesheet" href="/workspace.css"><body><div class="manual-shell"><main style="margin:0;width:100%"><header style="height:auto;padding:18px 22px"><div><h1>IDMS · 工单用料与备件依据</h1><p>合成隔离资料 · 独立QA数据库 · 不连接企业业务库</p></div></header><section class="content"><section class="panel" style="padding:16px;margin-bottom:18px"><label>隔离演示职责 <select id="qa-role"><option value="manager">备件管理员</option><option value="repairer">维修工程师</option><option value="auditor">只读审计员</option></select></label><div class="workspace-tabs" style="margin-top:15px"><button data-qa-view="inventory">库存依据</button><button data-qa-view="work-orders">工单用料</button><button data-qa-view="links">更换依据</button></div><p id="qa-status" role="status"></p></section><div id="app"></div></section><details id="qa-capture-panel" style="padding:16px"><summary>保存验证截图</summary><label>截图名称<input id="qa-capture-name" value="stock-desktop"></label><label>截图数据<textarea id="qa-capture-data" aria-label="截图数据"></textarea></label><button type="button" id="qa-capture-save">保存校验截图</button><p id="qa-capture-result" role="status"></p></details></main></div><script type="module">
import {sparesView,installSparesUi,workOrderStockUsage} from '/spares-paged-ui.js';import {maintenanceView} from '/maintenance-ui.js';
let role='manager';const state={view:'spares',actor:'manager',predictive:null,spares:{tab:'inventory',data:null}},root=document.querySelector('#app');
const api=async(path,options={})=>{const r=await fetch('/api/v1'+path,{...options,headers:{...options.headers,'x-idms-qa-role':role}}),v=await r.json();if(!r.ok)throw Object.assign(Error(v.message),{status:r.status,code:v.code});return v;};
const post=(path,body,_unused,key)=>api(path,{method:'POST',headers:{'content-type':'application/json','idempotency-key':key},body:JSON.stringify(body)}),notify=text=>{document.querySelector('#qa-status').textContent=text;};
function render(){root.innerHTML=state.view==='spares'?sparesView(state.spares,state.actor):maintenanceView(state.predictive?.workOrders||[],state.actor,false,{oidc:true,canExecute:role==='repairer',canApprove:false});if(state.view==='work-orders')for(const node of root.querySelectorAll('.work-order'))node.querySelector('.work-order-body')?.insertAdjacentHTML('beforeend',workOrderStockUsage(state.spares,node.id.slice(3)));}
const ui=installSparesUi({state,api,post,render,notify});
document.addEventListener('click',async event=>{const b=event.target.closest('button');if(!b)return;try{if(b.dataset.qaView){if(b.dataset.qaView==='work-orders'){state.predictive=await api('/predictive/overview');state.view='work-orders';await ui.load();}else{state.view='spares';await ui.navigate(b.dataset.qaView);}render();return;}if(b.dataset.action?.startsWith('spares-')){event.preventDefault();await ui.handle(b);}}catch(error){state.spares.error=error.message;notify(error.message);render();}});
document.addEventListener('submit',event=>{event.preventDefault();const b=event.target.querySelector('[type=submit]');if(b)ui.handle(b).catch(error=>{notify(error.message);render();});});
for(const type of ['input','change'])document.addEventListener(type,event=>{if(event.target.closest('#spares-form'))ui.capture();if(event.target.closest('#spares-history-filter'))ui.captureHistory();});
document.querySelector('#qa-role').addEventListener('change',async event=>{role=event.target.value;state.actor=role==='repairer'?'clerk':role==='auditor'?'auditor':'manager';ui.clear();if(state.view==='work-orders')state.predictive=await api('/predictive/overview');
await ui.load();render();});
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('[data-option-query]')){event.preventDefault();ui.handle({dataset:{action:'spares-option-search',field:event.target.dataset.optionQuery}}).catch(error=>notify(error.message));}});
document.querySelector("#qa-capture-save").addEventListener("click",async()=>{const field=document.querySelector("#qa-capture-data"),jpegBase64=field.value,name=document.querySelector("#qa-capture-name").value;field.value="";document.querySelector("#qa-capture-panel").open=false;const response=await fetch("/qa/screenshot",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name,jpegBase64})}),value=await response.json();document.querySelector("#qa-capture-result").textContent=response.ok?value.file:value.message;});
await ui.load();render();
</script></body></html>
