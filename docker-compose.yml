services:
  idms:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "server/index.ts"]
    ports: ["4010:4010"]
    env_file: [.env]
    volumes: [".:/app:ro"]
    depends_on: [postgres, timescaledb, keycloak, emqx]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idms_control
      POSTGRES_USER: idms_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["postgres_data:/var/lib/postgresql/data", "./infra/sql/control:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U idms_app -d idms_control"], interval: 10s, timeout: 5s, retries: 5 }
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: idms_telemetry
      POSTGRES_USER: idms_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["timescale_data:/var/lib/postgresql/data", "./infra/sql/telemetry:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U idms_app -d idms_telemetry"], interval: 10s, timeout: 5s, retries: 5 }
  emqx:
    image: emqx/emqx:5
    ports: ["1883:1883", "18083:18083"]
    volumes: ["emqx_data:/opt/emqx/data"]
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/idms_control
      KC_DB_USERNAME: idms_app
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
    ports: ["8080:8080"]
    volumes: ["./infra/keycloak:/opt/keycloak/data/import:ro"]
    depends_on: [postgres]
  ai-gateway:
    image: nginx:alpine
    profiles: ["integration-placeholders"]
    volumes: ["./infra/ai-gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
volumes: { postgres_data: {}, timescale_data: {}, emqx_data: {} }
