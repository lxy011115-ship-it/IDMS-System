name: IDMS complete current deployment composition v3

on:
  push:
    branches: [wip/current-deployment-composition-v3-20261027]
    paths: ['scripts/**', 'tests/**', 'server/**', 'services/**', 'integrations/**', 'package*.json', 'docs/validation/**', '.github/workflows/current-deployment-composition-v3.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-deployment-composition-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline-field-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate unchanged historical source profiles
        run: node scripts/verify-ci-source-policy-v2.mjs
      - name: Typecheck SITE backend
        run: node node_modules/typescript/bin/tsc -p server/tsconfig.json --noEmit --allowImportingTsExtensions
      - name: Verify actual PostgreSQL SCRAM and original-owner boundaries
        env:
          IDMS_COLD_FIELD_PG_BIN: /usr/lib/postgresql/16/bin
          IDMS_COLD_FIELD_PG_WORK: ${{ runner.temp }}/field-current-scram-unit
          IDMS_FIELD_CI_RESULT_DIRECTORY: ${{ runner.temp }}/idms-field-current-results
        run: node scripts/verify-field-current-ci-units-v2.mjs SCRAM
      - name: Fetch and authenticate Apache Maven 3.9.11
        id: maven
        run: python3 scripts/fetch-maven-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Fetch and authenticate Keycloak 26.8.1
        id: identity
        run: python3 scripts/fetch-keycloak-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Prepare approved public QA source data
        id: source
        run: node scripts/fixtures/create-controlled-cold-public-source-v1-qa.mjs "$RUNNER_TEMP/idms-field-current-source.json" "$GITHUB_OUTPUT"
      - name: Install broker libraries without a daemon
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcjson1 libdlt2 libwrap0 libwebsockets19t64 libmosquitto1
      - name: Authenticate and extract broker package
        id: broker
        run: python3 scripts/fetch-mosquitto-package-v2.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Verify complete SOURCE and current guarded FIELD materials and controlled transport
        id: native
        env:
          IDMS_MAVEN_HOME: ${{ steps.maven.outputs.directory }}
          IDMS_KEYCLOAK_SOURCE: ${{ steps.identity.outputs.directory }}
          IDMS_SOURCE_BUNDLE: ${{ steps.source.outputs.file }}
          IDMS_SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
          IDMS_QA_MOSQUITTO_BIN: ${{ steps.broker.outputs.directory }}
        run: node scripts/verify-field-current-materials-native-v8.mjs /usr/lib/postgresql/16/bin "$JAVA_HOME_21_X64" "$IDMS_MAVEN_HOME" "$IDMS_KEYCLOAK_SOURCE" "$IDMS_SOURCE_BUNDLE" "$IDMS_SOURCE_SHA256" "" "$IDMS_QA_MOSQUITTO_BIN"
      - name: Independently verify original case and retain bounded public result before final summary checks
        id: results
        if: always() && (steps.native.outcome == 'success' || steps.native.outcome == 'failure')
        env:
          IDMS_FIELD_CI_RESULT_DIRECTORY: ${{ runner.temp }}/idms-field-current-results
        run: node scripts/verify-field-current-ci-output-v3.mjs
      - name: Verify exact accepted case contracts, complete files and SOURCE-bound spool semantics
        if: success() && steps.results.outcome == 'success'
        env:
          IDMS_FIELD_CI_RESULT_DIRECTORY: ${{ runner.temp }}/idms-field-current-results
          IDMS_COLD_FIELD_MATERIAL_QA_CASE: ${{ github.workspace }}/work/field-current-materials-native-v8-20261026/${{ steps.results.outputs.nonce }}
          IDMS_COLD_FIELD_MATERIAL_QA_WORK: ${{ runner.temp }}/idms-field-current-case-units
          IDMS_FIELD_INPUT_CACHE_QA_WORK: ${{ runner.temp }}/idms-field-input-cache-units
          IDMS_FIELD_CURRENT_ENDPOINT_QA_CASE: ${{ github.workspace }}/work/field-current-materials-native-v8-20261026/${{ steps.results.outputs.nonce }}
          IDMS_FIELD_CI_SAFE_BASELINE_CASE: ${{ github.workspace }}/work/field-current-materials-native-v8-20261026/${{ steps.results.outputs.nonce }}
          IDMS_FIELD_CI_SAFE_BASELINE_INDEPENDENT: ${{ runner.temp }}/idms-field-current-results/verification-process-result.json
        run: node scripts/verify-field-current-ci-units-v2.mjs CASE
      - name: Preserve bounded JSON results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: field-current-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/idms-field-current-results/*.json
          retention-days: 30
          if-no-files-found: warn
          compression-level: 9
          include-hidden-files: false
      - name: Confirm tracked source unchanged
        if: always()
        run: git diff --exit-code --no-ext-diff

  current-deployment-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate unchanged historical source profiles
        run: node scripts/verify-ci-source-policy-v2.mjs
      - name: Typecheck SITE backend
        run: node node_modules/typescript/bin/tsc -p server/tsconfig.json --noEmit --allowImportingTsExtensions
      - name: Fetch and authenticate Apache Maven 3.9.11
        id: maven
        run: python3 scripts/fetch-maven-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Fetch and authenticate Keycloak 26.8.1
        id: identity
        run: python3 scripts/fetch-keycloak-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Prepare new approved public QA source data
        id: source
        run: node scripts/fixtures/create-controlled-cold-public-source-v1-qa.mjs "$RUNNER_TEMP/idms-current-deployment-source.json" "$GITHUB_OUTPUT"
      - name: Install broker libraries without a daemon
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcjson1 libdlt2 libwrap0 libwebsockets19t64 libmosquitto1
      - name: Authenticate and extract broker package
        id: broker
        run: python3 scripts/fetch-mosquitto-package-v2.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Populate isolated Maven cache with actual online workflow and reader builds
        env:
          IDMS_MAVEN_HOME: ${{ steps.maven.outputs.directory }}
        run: |
          mkdir -p "$RUNNER_TEMP/idms-current-deployment-m2"
          node scripts/warm-cold-current-deployment-build-cache-v1.mjs "$JAVA_HOME_21_X64" "$IDMS_MAVEN_HOME" "$RUNNER_TEMP/idms-current-deployment-cache-warm" "$RUNNER_TEMP/idms-current-deployment-m2"
      - name: Run new complete SOURCE, original owned process chains and full same-case independent verification
        id: full
        env:
          IDMS_MAVEN_HOME: ${{ steps.maven.outputs.directory }}
          IDMS_KEYCLOAK_SOURCE: ${{ steps.identity.outputs.directory }}
          IDMS_SOURCE_BUNDLE: ${{ steps.source.outputs.file }}
          IDMS_SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
          IDMS_QA_MOSQUITTO_BIN: ${{ steps.broker.outputs.directory }}
        run: |
          mkdir -p "$RUNNER_TEMP/idms-current-deployment-m2"
          node scripts/run-cold-current-deployment-ci-v2.mjs /usr/lib/postgresql/16/bin "$JAVA_HOME_21_X64" "$IDMS_MAVEN_HOME" "$IDMS_KEYCLOAK_SOURCE" "$IDMS_SOURCE_BUNDLE" "$IDMS_SOURCE_SHA256" "$RUNNER_TEMP/idms-current-deployment-m2" "$IDMS_QA_MOSQUITTO_BIN"
      - name: Preserve only the four explicit bounded public summaries
        if: always() && steps.full.outputs.public_result_directory != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-deployment-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.full.outputs.public_result_directory }}/native-summary-v1.json
            ${{ steps.full.outputs.public_result_directory }}/independent-summary-v1.json
            ${{ steps.full.outputs.public_result_directory }}/ci-summary-v1.json
            ${{ steps.full.outputs.public_result_directory }}/failure-summary-v1.json
          retention-days: 30
          if-no-files-found: warn
          compression-level: 9
          include-hidden-files: false
      - name: Confirm tracked source unchanged
        if: always()
        run: git diff --exit-code --no-ext-diff
