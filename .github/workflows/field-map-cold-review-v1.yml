name: Current-map durable cold review

on:
  push:
    branches: [wip/field-map-cold-review-20261024]
    paths: ['scripts/**', 'tests/**', 'docs/validation/**', '.github/workflows/field-map-cold-review-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-map-cold-review-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cold-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate existing source profiles
        run: node scripts/verify-ci-source-policy-v2.mjs
      - name: Reject caller-supplied authority and incomplete recovery inputs
        run: node --test tests/field-map-cold-review-v1.test.mjs
      - name: Fetch and authenticate Apache Maven 3.9.11
        id: maven
        run: python3 scripts/fetch-maven-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Fetch and authenticate Keycloak 26.8.1
        id: identity
        run: python3 scripts/fetch-keycloak-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Prepare public approved source data
        id: source
        run: node scripts/fixtures/create-controlled-cold-public-source-v1-qa.mjs "$RUNNER_TEMP/idms-review-source.json" "$GITHUB_OUTPUT"
      - name: Verify real R4 cold producer, complete facts and durable review reentry
        id: native
        env:
          IDMS_MAVEN_HOME: ${{ steps.maven.outputs.directory }}
          IDMS_KEYCLOAK_SOURCE: ${{ steps.identity.outputs.directory }}
          IDMS_SOURCE_BUNDLE: ${{ steps.source.outputs.file }}
          IDMS_SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: node scripts/verify-field-map-cold-review-v1.mjs /usr/lib/postgresql/16/bin "$JAVA_HOME_21_X64" "$IDMS_MAVEN_HOME" "$IDMS_KEYCLOAK_SOURCE" "$IDMS_SOURCE_BUNDLE" "$IDMS_SOURCE_SHA256" ""
      - name: Independently rebuild complete roots and verify archive and normal retirement
        if: always() && (steps.native.outcome == 'success' || steps.native.outcome == 'failure')
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readdir} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const cases=(await readdir('work/field-map-cold-review-native-v1-20261024',{withFileTypes:true})).filter(e=>e.isDirectory()&&/^[a-f0-9]{12}$/.test(e.name));
          assert.equal(cases.length,1);
          execFileSync(process.execPath,['scripts/verify-field-map-cold-review-cleanup-v2.mjs',cases[0].name],{stdio:'inherit'});
          JS
      - name: Confirm tracked source unchanged
        if: always()
        run: git diff --exit-code --no-ext-diff
