name: Field edge owned lifecycle

on:
  push:
    branches: [wip/field-owned-lifecycle-20261024]
    paths: ['scripts/**', 'tests/**', 'services/**', 'server/**', 'package*.json', '.github/workflows/field-owned-lifecycle-v1.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'services/field/**', '.github/workflows/field-owned-lifecycle-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-owned-lifecycle-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  field-edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate all frozen source profiles
        run: node scripts/verify-ci-source-policy-v2.mjs
      - name: Typecheck production field runner
        run: node node_modules/typescript/bin/tsc -p server/tsconfig.json --noEmit --allowImportingTsExtensions
      - name: Verify actual held HTTP, identity locks and owned child retirement
        run: node --test --test-concurrency=1 tests/field-edge-runner-v2.test.mjs tests/field-edge-lifecycle-v1.test.mjs
      - name: Confirm tracked source unchanged
        if: always()
        run: git diff --exit-code --no-ext-diff
