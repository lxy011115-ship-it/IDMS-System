name: Application registry checkpoint verification

on:
  push:
    branches: [main, wip/predictive-creation-v4]
    paths: ['scripts/ci-source-policy-v2.mjs', 'scripts/verify-ci-source-policy-v2.mjs', 'tests/ci-source-policy-v2.test.mjs', 'tests/ci-source-policy-preflight-v2.test.mjs', 'scripts/runtime-application-registry-v1.mjs', 'scripts/runtime-application-config-v1.mjs', 'scripts/fixtures/application-registry-checkpoint-writer-v1-qa.mjs', 'scripts/fixtures/application-registry-checkpoint-writer-v2-qa.mjs', 'scripts/fixtures/application-registry-checkpoint-lock-v1-qa.mjs', 'tests/application-registry-live-v1.test.mjs', 'tests/application-registry-live-v2.test.mjs', 'tests/application-registry-checkpoint-lock-v1.test.mjs', 'package*.json', 'docs/validation/ci-source-*.json', '.github/workflows/application-registry-checkpoint-verification.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/ci-source-policy-v2.mjs', 'scripts/verify-ci-source-policy-v2.mjs', 'tests/ci-source-policy-v2.test.mjs', 'tests/ci-source-policy-preflight-v2.test.mjs', 'scripts/runtime-application-registry-v1.mjs', 'scripts/runtime-application-config-v1.mjs', 'scripts/fixtures/application-registry-checkpoint-writer-v1-qa.mjs', 'scripts/fixtures/application-registry-checkpoint-writer-v2-qa.mjs', 'scripts/fixtures/application-registry-checkpoint-lock-v1-qa.mjs', 'tests/application-registry-live-v1.test.mjs', 'tests/application-registry-live-v2.test.mjs', 'tests/application-registry-checkpoint-lock-v1.test.mjs', 'package*.json', 'docs/validation/ci-source-*.json', '.github/workflows/application-registry-checkpoint-verification.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-registry-checkpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate all source profiles with six exact CI bindings
        run: node scripts/verify-ci-source-policy-v2.mjs
      - name: Verify real concurrent WAL checkpoints, lifecycle contracts and tamper rejection
        run: node --test --test-concurrency=1 tests/application-registry-live-v2.test.mjs tests/application-registry-checkpoint-lock-v1.test.mjs scripts/runtime-application-v1.test.mjs scripts/runtime-application-start-v2.test.mjs tests/application-lifecycle-v1.test.mjs tests/ci-source-policy-v2.test.mjs tests/ci-source-policy-preflight-v2.test.mjs
      - name: Confirm tracked source files were not changed
        if: always()
        run: git diff --exit-code --no-ext-diff
