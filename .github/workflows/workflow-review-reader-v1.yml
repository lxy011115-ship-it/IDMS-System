name: Read-only recovery workflow engine

on:
  push:
    branches: [wip/workflow-review-reader-20261024]
    paths: ['scripts/**', 'services/workflow-review-reader-v1/**', 'docs/validation/**', '.github/workflows/workflow-review-reader-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-review-reader-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate existing source profiles
        run: node scripts/verify-ci-source-policy-v2.mjs
      - name: Fetch and authenticate Apache Maven 3.9.11
        id: maven
        run: python3 scripts/fetch-maven-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Verify nonempty Flowable through actual read-only SQL identities
        id: native
        env:
          IDMS_MAVEN_HOME: ${{ steps.maven.outputs.directory }}
        run: node scripts/verify-workflow-review-reader-v1.mjs /usr/lib/postgresql/16/bin "$JAVA_HOME_21_X64" "$IDMS_MAVEN_HOME"
      - name: Independently verify exact source, SQL fingerprints and normal retirement
        if: always() && (steps.native.outcome == 'success' || steps.native.outcome == 'failure')
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readdir} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const cases=(await readdir('work/workflow-review-reader-native-v1-20261024',{withFileTypes:true})).filter(x=>x.isDirectory()&&/^[a-f0-9]{12}$/.test(x.name));
          assert.equal(cases.length,1);
          execFileSync(process.execPath,['scripts/verify-workflow-review-reader-cleanup-v1.mjs',cases[0].name],{stdio:'inherit'});
          JS
      - name: Confirm tracked source unchanged
        if: always()
        run: git diff --exit-code --no-ext-diff
