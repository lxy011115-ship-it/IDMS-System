name: Portable workflow lifecycle verification

on:
  push:
    branches: [main, wip/predictive-creation-v4]
    paths: ['scripts/**', 'server/**', 'services/**', 'package*.json', '.github/workflows/workflow-portable-verification.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/**', 'server/**', 'services/**', 'package*.json', '.github/workflows/workflow-portable-verification.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-workflow-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Locate the runner Maven installation explicitly
        id: maven
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil
          executable = shutil.which('mvn')
          assert executable, 'Maven must already be installed on the runner'
          home = Path(executable).resolve(strict=True).parent.parent
          assert (home / 'bin/m2.conf').is_file() and (home / 'boot').is_dir()
          assert not any(ord(c) < 32 for c in str(home))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('home=' + str(home) + '\n')
          PY
      - name: Build a private source copy and verify actual Flowable normal stop
        env:
          IDMS_MAVEN_HOME: ${{ steps.maven.outputs.home }}
        run: node scripts/verify-workflow-normal-stop-portable-v1.mjs /usr/lib/postgresql/16/bin "$JAVA_HOME_21_X64" "$IDMS_MAVEN_HOME"
      - name: Confirm tracked source files were not changed
        if: always()
        run: git diff --exit-code --no-ext-diff
