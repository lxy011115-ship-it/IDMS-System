name: PostgreSQL physical recovery verification

on:
  push:
    branches: [main, wip/predictive-creation-v4]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-physical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-physical-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify fresh owned PostgreSQL 16 cluster and encrypted physical recovery
        run: node scripts/verify-pg-physical-platform-v1.mjs /usr/lib/postgresql/16/bin
