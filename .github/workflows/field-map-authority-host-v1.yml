name: Field current identity and cold admission

on:
  push:
    branches: [wip/field-map-authority-host-20261024]
    paths: ['scripts/**', 'tests/**', 'server/**', 'services/**', 'package*.json', 'docs/validation/ci-source-*.json', '.github/workflows/field-map-authority-host-v1.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'server/**', 'services/**', 'package*.json', 'docs/validation/ci-source-*.json', '.github/workflows/field-map-authority-host-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-map-authority-host-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate all source profiles with six exact CI bindings
        run: node scripts/verify-ci-source-policy-v2.mjs
      - name: Typecheck current map authority host backend
        run: node node_modules/typescript/bin/tsc -p server/tsconfig.json --noEmit --allowImportingTsExtensions
      - name: Verify host configuration and actual static module parsing
        run: node --test --test-concurrency=1 tests/field-map-authority-host-v1.test.mjs tests/field-source-static-graph-v1.test.mjs
      - name: Fetch and authenticate Apache Maven 3.9.11
        id: maven
        run: python3 scripts/fetch-maven-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Fetch and authenticate Keycloak 26.8.1
        id: identity
        run: python3 scripts/fetch-keycloak-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Prepare public approved source data
        id: source
        run: node scripts/fixtures/create-controlled-cold-public-source-v1-qa.mjs "$RUNNER_TEMP/idms-controlled-source.json" "$GITHUB_OUTPUT"
      - name: Verify actual field authority and physical cold admission
        id: native
        env:
          IDMS_MAVEN_HOME: ${{ steps.maven.outputs.directory }}
          IDMS_KEYCLOAK_SOURCE: ${{ steps.identity.outputs.directory }}
          IDMS_SOURCE_BUNDLE: ${{ steps.source.outputs.file }}
          IDMS_SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: node scripts/verify-field-map-authority-host-v1.mjs /usr/lib/postgresql/16/bin "$JAVA_HOME_21_X64" "$IDMS_MAVEN_HOME" "$IDMS_KEYCLOAK_SOURCE" "$IDMS_SOURCE_BUNDLE" "$IDMS_SOURCE_SHA256"
      - name: Independently verify field guard rollback and owned cleanup
        if: always() && (steps.native.outcome == 'success' || steps.native.outcome == 'failure')
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readdir} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const root='work/field-map-authority-host-v1-20261024';
          const cases=(await readdir(root,{withFileTypes:true})).filter(e=>e.isDirectory()&&/^[a-f0-9]{12}$/.test(e.name));
          assert.equal(cases.length,1);
          execFileSync(process.execPath,['scripts/verify-field-map-authority-host-cleanup-v2.mjs',cases[0].name],{stdio:'inherit'});
          JS
      - name: Confirm tracked source files were not changed
        if: always()
        run: git diff --exit-code --no-ext-diff
