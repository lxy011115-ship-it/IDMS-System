name: Authentication audit bounded peer request files v1

on:
  push:
    branches: [wip/auth-audit-map-peer-request-v1-20261026]
    paths: ['scripts/**', 'tests/**', 'docs/validation/**', '.github/workflows/cold-auth-audit-map-peer-request-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cold-auth-audit-map-peer-request-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cold-readonly-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate existing source profiles
        run: node scripts/verify-ci-source-policy-v2.mjs
      - name: Check credential, SCRAM and intent boundaries
        run: node --max-old-space-size=1024 --experimental-vm-modules --test --test-reporter=tap tests/cold-owned-review-session-v5.test.mjs tests/cold-readonly-review-v18.test.mjs tests/cold-source-full-facts-v2.test.mjs tests/cold-review-image-config-v2.test.mjs tests/cold-plan-journal-progress-v3.test.mjs tests/cold-review-consistency-v1.test.mjs tests/cold-current-actors-v6.test.mjs tests/workflow-reader-peer-queue-v1.test.mjs tests/cold-review-plan-journal-v2.test.mjs tests/workflow-reader-sql-window-v1.test.mjs tests/cold-plan-approval-journal-v1.test.mjs tests/cold-plan-approval-coordinator-v1.test.mjs tests/cold-registration-auth-audit-coordinator-v2.test.mjs tests/cold-registration-job-cells-v1.test.mjs server/governance-job-crypto-v4.test.ts server/maintenance-job-crypto-v4.test.ts server/predictive-job-crypto-v4.test.ts server/predictive-cancel-job-security-v1.test.ts tests/cold-registration-sql-cohort-v1.test.mjs tests/cold-plan-approval-wal-lock-v1.test.mjs tests/cold-plan-approval-anchor-abort-v1.test.mjs tests/cold-plan-approval-capacity-v1.test.mjs tests/cold-registration-file-set-v2.test.mjs
      - name: Verify current authentication map indices, coordinator and independent raw witness consumer
        env:
          IDMS_AUTH_MAP_INDEX_UNIT_WORK: ${{ runner.temp }}/idms-auth-map-index-unit
          IDMS_AUTH_MAP_OFFLINE_UNIT_WORK: ${{ runner.temp }}/idms-auth-map-offline-unit
          IDMS_READER_COLLECTOR_MISSING_ROOT: ${{ runner.temp }}/idms-reader-collector-missing
        run: |
          mkdir -p "$IDMS_AUTH_MAP_INDEX_UNIT_WORK" "$IDMS_AUTH_MAP_OFFLINE_UNIT_WORK"
          export IDMS_READER_HELPER_UNIT_JAVA="$JAVA_HOME_21_X64/bin/java"
          export IDMS_READER_HELPER_UNIT_EMPTY_CP="$RUNNER_TEMP/idms-reader-helper-unit-empty-cp"
          mkdir -p "$IDMS_READER_HELPER_UNIT_EMPTY_CP"
          export IDMS_READER_ATTACH_QA_CLASSES="$RUNNER_TEMP/idms-reader-attach-diagnostic-classes"
          mkdir -p "$IDMS_READER_ATTACH_QA_CLASSES"
          "$JAVA_HOME_21_X64/bin/javac" --release 21 -encoding UTF-8 --add-modules jdk.attach -d "$IDMS_READER_ATTACH_QA_CLASSES" scripts/lifecycle-java/LifecycleWireV1.java scripts/lifecycle-java-peer-file-v4/OwnedReaderPeerAttachV1.java scripts/lifecycle-java-peer-file-v4/OwnedReaderPeerAgentV1.java tests/fixtures/OwnedReaderPeerAttachDiagnosticQaV1.java tests/fixtures/OwnedReaderPeerRequestFileQaV1.java
          "$JAVA_HOME_21_X64/bin/java" --add-modules jdk.attach -cp "$IDMS_READER_ATTACH_QA_CLASSES" com.idms.lifecycle.OwnedReaderPeerAttachDiagnosticQaV1
          mkdir -p "$RUNNER_TEMP/idms-reader-request-file-unit"
          "$JAVA_HOME_21_X64/bin/java" --add-modules jdk.attach -cp "$IDMS_READER_ATTACH_QA_CLASSES" com.idms.lifecycle.OwnedReaderPeerRequestFileQaV1 "$RUNNER_TEMP/idms-reader-request-file-unit"
          node --max-old-space-size=1024 --experimental-vm-modules --test --test-reporter=tap tests/cold-auth-audit-map-values-v1.test.mjs tests/cold-auth-audit-map-index-v2.test.mjs tests/cold-auth-audit-map-coordinator-v2.test.mjs tests/cold-auth-audit-map-offline-v2.test.mjs tests/controlled-cold-failure-chain-v1.test.mjs tests/owned-reader-jvm-failure-v5.test.mjs
      - name: Verify actual JVM reply count, byte and reserved-release boundaries
        run: |
          mkdir -p "$RUNNER_TEMP/idms-reader-reply-budget"
          "$JAVA_HOME_21_X64/bin/javac" --release 21 -d "$RUNNER_TEMP/idms-reader-reply-budget" services/workflow-review-reader-v4/src/main/java/com/idms/workflowreview/ReaderPeerReplyBudget.java tests/fixtures/java/ReaderPeerReplyBudgetQa.java
          "$JAVA_HOME_21_X64/bin/java" -Xms32m -Xmx256m -cp "$RUNNER_TEMP/idms-reader-reply-budget" com.idms.workflowreview.ReaderPeerReplyBudgetQa
      - name: Fetch and authenticate Apache Maven 3.9.11
        id: maven
        run: python3 scripts/fetch-maven-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Fetch and authenticate Keycloak 26.8.1
        id: identity
        run: python3 scripts/fetch-keycloak-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Prepare public approved source data
        id: source
        run: node scripts/fixtures/create-controlled-cold-public-source-v1-qa.mjs "$RUNNER_TEMP/idms-readonly-review-source.json" "$GITHUB_OUTPUT"
      - name: Verify complete restore, both commit outcomes and running owned-reader review
        id: native
        env:
          IDMS_MAVEN_HOME: ${{ steps.maven.outputs.directory }}
          IDMS_KEYCLOAK_SOURCE: ${{ steps.identity.outputs.directory }}
          IDMS_SOURCE_BUNDLE: ${{ steps.source.outputs.file }}
          IDMS_SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: node scripts/verify-cold-auth-audit-map-observed-v9.mjs /usr/lib/postgresql/16/bin "$JAVA_HOME_21_X64" "$IDMS_MAVEN_HOME" "$IDMS_KEYCLOAK_SOURCE" "$IDMS_SOURCE_BUNDLE" "$IDMS_SOURCE_SHA256" ""
      - name: Independently rebuild both roots, authenticate full archive and normal retirement
        if: always() && (steps.native.outcome == 'success' || steps.native.outcome == 'failure')
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readdir} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const cases=(await readdir('work/cold-registration-auth-audit-map-native-v5-20261025',{withFileTypes:true})).filter(e=>e.isDirectory()&&/^[a-f0-9]{12}$/.test(e.name));
          assert.equal(cases.length,1);
          execFileSync(process.execPath,['scripts/verify-cold-auth-audit-map-cleanup-v6.mjs',cases[0].name],{stdio:'inherit'});
          JS
      - name: Confirm tracked source unchanged
        if: always()
        run: git diff --exit-code --no-ext-diff
