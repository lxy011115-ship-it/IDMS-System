name: Captured workflow reader source policy

on:
  push:
    branches: [wip/workflow-source-reader-20261024]
    paths: ['scripts/**', 'tests/**', 'docs/validation/**', '.github/workflows/workflow-source-reader-v1.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-source-reader-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  captured-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate existing source profiles
        run: node scripts/verify-ci-source-policy-v2.mjs
      - name: Reject impersonated provisioning and widened HBA or freeze inputs
        run: node --test tests/workflow-review-source-contract-v1.test.mjs
      - name: Fetch and authenticate Apache Maven 3.9.11
        id: maven
        run: python3 scripts/fetch-maven-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Fetch and authenticate Keycloak 26.8.1
        id: identity
        run: python3 scripts/fetch-keycloak-distribution-v1.py "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"
      - name: Verify actual source installation, capture, three closed gates and read-only workflow
        id: native
        env:
          IDMS_MAVEN_HOME: ${{ steps.maven.outputs.directory }}
          IDMS_KEYCLOAK_SOURCE: ${{ steps.identity.outputs.directory }}
        run: node scripts/verify-workflow-source-reader-v1.mjs /usr/lib/postgresql/16/bin "$JAVA_HOME_21_X64" "$IDMS_MAVEN_HOME" "$IDMS_KEYCLOAK_SOURCE"
      - name: Independently verify source material, original receipts and normal retirement
        if: always() && (steps.native.outcome == 'success' || steps.native.outcome == 'failure')
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readdir} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const cases=(await readdir('work/workflow-source-reader-native-v1-20261024',{withFileTypes:true})).filter(e=>e.isDirectory()&&/^[a-f0-9]{12}$/.test(e.name));
          assert.equal(cases.length,1);
          execFileSync(process.execPath,['scripts/verify-workflow-source-reader-cleanup-v2.mjs',cases[0].name],{stdio:'inherit'});
          JS
      - name: Confirm tracked source unchanged
        if: always()
        run: git diff --exit-code --no-ext-diff
