<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IDMS 恢复维护核对</title><link rel="stylesheet" href="/maintenance.css"><script src="/maintenance.js" defer></script></head>
<body><header><strong>IDMS</strong><span>恢复维护</span><button id="logout" hidden>退出登录</button></header><main><p class="eyebrow">恢复后核对 · 只读</p><h1>确认恢复结果</h1><p>业务写入和现场接入保持关闭。此页显示已核验的恢复与审批记录；启用前仍须复核当前外部状态。</p><section id="login-panel"><h2>登录维护入口</h2><p>请使用当前企业授权的维护账号。</p><a class="button" href="/api/v1/auth/login?returnTo=%2F">使用企业账号登录</a></section><p id="message" role="status">正在确认登录状态…</p><section id="result" hidden><div class="title"><h2>恢复结果</h2><button id="refresh">重新核对</button></div><dl id="summary"></dl><div id="review-state" class="pending">当前外部状态：待检查　·　独立审批：待完成</div><section id="plan-panel" hidden><h3>当前恢复计划</h3><dl id="plan-summary"></dl><h3>计划绑定的已发布引用</h3><ul id="plan-references"></ul></section><section id="review-actions" hidden><h3>恢复审批</h3><p id="review-action-help"></p><label><input id="review-confirm" type="checkbox"> 我已核对目标、恢复数据和计划引用；如已有计划，本次提交将明确替换该计划。</label><p><button id="submit-plan" hidden>提交恢复计划</button> <button id="approve-plan" hidden>独立批准当前计划</button></p></section><section id="registration-panel" hidden><h3>待执行现场注册</h3><p>本计划绑定以下候选；实际注册和激活尚待完成。</p><dl id="registration-summary"></dl><div id="registration-channels"></div></section><h3>恢复数据</h3><div class="table-wrap"><table><thead><tr><th>关系</th><th>记录数</th></tr></thead><tbody id="relations"></tbody></table></div><h3>历史已发布引用</h3><p>以下引用来自备份，不能作为当前外部状态的确认。</p><ul id="references"></ul></section></main></body></html>
