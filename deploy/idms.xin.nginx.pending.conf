# Inactive template. Install only after ICP filing, trusted TLS and OIDC activation.
# Resolve the backend address from the proxy network; the app currently binds loopback.
# Never route this template to an unrelated existing service.
server {
  listen 80;
  server_name idms.xin www.idms.xin;
  location /.well-known/acme-challenge/ { root /data/idms-acme; }
  location / { return 301 https://idms.xin$request_uri; }
}
# HTTPS activation must supply a valid certificate, an isolated bridge/loopback
# transport, identity endpoint, strict proxy headers and tested callback URLs.
# This file intentionally cannot publish a placeholder HTTPS site.

